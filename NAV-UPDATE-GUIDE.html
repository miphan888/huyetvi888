<!-- ✅ THAY BẰNG script đơn giản hơn (hoặc để main.js xử lý) -->
<script>
(function() {
  const btn = document.getElementById('map-nav-btn');
  const dd  = document.getElementById('map-nav-dd');
  if (!btn || !dd) return;
  btn.addEventListener('click', e => { e.stopPropagation(); dd.classList.toggle('open'); });
  document.addEventListener('click', () => dd.classList.remove('open'));
  document.getElementById('map-nav-panel')?.addEventListener('click', e => e.stopPropagation());
})();
</script>
